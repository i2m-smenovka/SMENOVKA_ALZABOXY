<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<!-- ==================================================================================
     JEDINÉ, ČO TREBA UPRAVIŤ: medzi úvodzovky nižšie vlož odkaz na smenovku
     (Apps Script → Nasadiť → Spravovať nasadenia → Webová aplikácia → URL, končí na /exec)
     ================================================================================== -->
<script>var SMENOVKA_URL = "SEM_VLOZ_ODKAZ_NA_SMENOVKU";</script>
<title>Smenovka ALZABOXY</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smenovka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<script src="push-config.js"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #uvod { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 600 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #555; background: #fff; transition: opacity .3s; text-align: center; padding: 0 24px; }
  #uvod img { width: 120px; height: 120px; }
  #uvod .bar { width: 140px; height: 4px; border-radius: 4px; background: #eee; overflow: hidden; }
  #uvod .bar i { display: block; width: 40%; height: 100%; background: #6CBD45; animation: b 1.1s ease-in-out infinite; }
  @keyframes b { 0% { margin-left: -40% } 100% { margin-left: 100% } }
  #uvod.skry { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="uvod"><img src="icon-512.png" alt="Smenovka" style="border-radius:24px"><img src="logo-i2m.png" alt="I2M" style="width:90px;height:90px;margin-top:-6px"><div class="bar"><i></i></div><div id="uvodTxt">Načítavam smenovku…</div></div>
<script>
  (function () {
    var uvod = document.getElementById('uvod'), txt = document.getElementById('uvodTxt');
    if (!/^https:\/\/script\.google\.com\//.test(SMENOVKA_URL)) { txt.innerHTML = 'V súbore <b>index.html</b> ešte nie je vložený odkaz na smenovku (SMENOVKA_URL).'; return; }
    var f = document.createElement('iframe');
    f.src = SMENOVKA_URL;
    f.title = 'Smenovka ALZABOXY';
    f.allow = 'camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share';
    f.addEventListener('load', function () { uvod.classList.add('skry'); });
    document.body.appendChild(f);
    setTimeout(function () { uvod.classList.add('skry'); }, 15000);   // keby sa „load“ neohlásil
    window.addEventListener('offline', function () { uvod.classList.remove('skry'); txt.textContent = 'Nie je pripojenie na internet – smenovka sa načíta, keď sa pripojenie vráti.'; });
    window.addEventListener('online', function () { location.reload(); });
  })();
  /* smenovka dá vedieť, že je nasadená nová verzia – obal sa obnoví celý (načíta sa nová verzia) */
  window.addEventListener('message', function (e) {
    try { if (e.data && e.data.smenovka === 'obnovit' && /(\.googleusercontent\.com|script\.google\.com)$/.test(new URL(e.origin).hostname)) location.reload(); } catch (x) {}
  });
  var SW = 'serviceWorker' in navigator ? navigator.serviceWorker.register('sw.js') : null;
  if (SW) SW.catch(function () {});

  /* ---------- Upozornenia (Firebase) ---------- */
  var APP = null, PRIHLASENY = false;
  function pushPodpora() {
    if (!self.FIREBASE_CONFIG || !self.VAPID_KEY || !SW || !('Notification' in window) || !('PushManager' in window)) return false;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent), plocha = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    return !ios || plocha;   // iPhone: len appka pridaná na plochu
  }
  var fbScript = null;
  function nacitajFirebase() {
    if (fbScript) return fbScript;
    var js = function (src) { return new Promise(function (ok, chyba) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = chyba; document.head.appendChild(s); }); };
    fbScript = js('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js').then(function () { return js('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js'); })
      .then(function () { if (!firebase.apps.length) firebase.initializeApp(self.FIREBASE_CONFIG); return firebase.messaging(); });
    return fbScript;
  }
  function posliToken() {
    if (!APP || Notification.permission !== 'granted') return;
    Promise.all([nacitajFirebase(), SW]).then(function (x) { return x[0].getToken({ vapidKey: self.VAPID_KEY, serviceWorkerRegistration: x[1] }); })
      .then(function (t) { if (t && APP) APP.postMessage({ obal: 'smenovka', typ: 'pushToken', token: t, link: location.href.split('#')[0].split('?')[0], zariadenie: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '' }, '*'); })
      .catch(function (e) { console.warn('Upozornenia: ' + e); });
  }
  var pas = null;
  function ukazPas() {
    if (pas || !PRIHLASENY || !pushPodpora() || Notification.permission !== 'default') return;
    try { if (+localStorage.getItem('pushNeskor') > Date.now()) return; } catch (e) {}
    pas = document.createElement('div');
    pas.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:12px;z-index:10;background:#141716;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font:600 14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:520px;margin:0 auto');
    pas.innerHTML = '<span style="flex:1">🔔 Zapni si upozornenia – nové správy v chate, nahraté POD a vybavené žiadosti o trasy.</span>' +
      '<button type="button" data-a="ano" style="border:0;border-radius:10px;background:#6CBD45;color:#fff;font:inherit;font-weight:800;padding:10px 14px">Zapnúť</button>' +
      '<button type="button" data-a="nie" style="border:0;background:transparent;color:#bbb;font:inherit;padding:10px 6px">Neskôr</button>';
    pas.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.getAttribute('data-a') === 'nie') { try { localStorage.setItem('pushNeskor', String(Date.now() + 3 * 864e5)); } catch (x) {} skryPas(); return; }
      Notification.requestPermission().then(function (p) { skryPas(); if (p === 'granted') posliToken(); });
    });
    document.body.appendChild(pas);
  }
  function skryPas() { if (pas) { pas.remove(); pas = null; } }
  window.addEventListener('message', function (e) {
    try {
      var d = e.data; if (!d || !/(\.googleusercontent\.com|script\.google\.com)$/.test(new URL(e.origin).hostname)) return;
      if (d.smenovka === 'prihlaseny') { APP = e.source; PRIHLASENY = !d.demo; if (!PRIHLASENY) return; if (Notification.permission === 'granted') posliToken(); else ukazPas(); }
      if (d.smenovka === 'odhlaseny') { PRIHLASENY = false; skryPas(); }
    } catch (x) {}
  });
</script>
</body>
</html>
